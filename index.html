<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Shilip's Baecation</title>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css?v=20260906">
  </head>

  <body>

    <script>
      function passWord() {
      var testV = 1;
      var pass1 = prompt('Chuck it in here 🙃');
      while (testV < 3) {
      if (!pass1)
      history.go(-1);
      if (pass1.toLowerCase() == "17mar26") {
      window.open('front.html',"_self");
      break;
      }
      testV+=1;
      var pass1 =
      prompt('Oh no, wrong password. Try again 😞','Password');
      }
      if (pass1.toLowerCase()!="password" & testV ==3)
      history.go(-1);
      return " ";
      }
    </script>

    <main>
      <div class="gate-wrap">
        <div class="gate-card">
          <div class="gate-emoji">🔒💌</div>
          <p>For Shilu Only 🌚</p>
          <input type="button" value="Press to enter the password 😊" onClick="passWord()">
        </div>
      </div>
    </main>
  </body>

</html>
