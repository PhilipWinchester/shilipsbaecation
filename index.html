<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Password...</title>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Modak&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@200;400;600;800&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>


    <main>

        <div class="wrapper">
          <SCRIPT>
          function passWord() {
          var testV = 1;
          var pass1 = prompt('Chuck it in here 🙃');
          while (testV < 3) {
          if (!pass1)
          history.go(-1);
          if (pass1.toLowerCase() == "111100000000010") {
          window.open('front.html',"_self");
          break;
          }
          testV+=1;
          var pass1 =
          prompt('Oh no, wrong password. Try again 😞','Password');
          }
          if (pass1.toLowerCase()!="password" & testV ==3)
          history.go(-1);
          return " ";
          }
          </SCRIPT>
          <CENTER>
          <FORM class="password-form" >
          <input type="button" value="Press to use the password that the handsom guy handed you" onClick="passWord()">
          <p> It's a pretty strange looking password tbf... I wonder what it means 🤔</p>
          </FORM>
          </CENTER>
        </div>


    </main>
  </body>

</html>
